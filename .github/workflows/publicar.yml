name: Publicar sitio

on:
  # Cada vez que subes cambios a main: publica con los datos ya guardados en el repo.
  push:
    branches: [main]
  # Diario 02:00 UTC = 20:00 en CDMX (la CNE actualiza a las 18:00): descarga precios nuevos.
  schedule:
    - cron: '0 2 * * *'
  # Botón "Run workflow" en GitHub para correrlo a mano.
  workflow_dispatch:
    inputs:
      actualizar_gasolina:
        description: 'Descargar precios nuevos de la CNE'
        type: boolean
        default: true

# Nunca dos publicaciones al mismo tiempo.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write # para guardar el histórico diario en el repo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://sacacuentas.isai-dev.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Descargar precios de gasolina (CNE)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_gasolina)
        run: npm run gasolina:actualizar

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Guardar datos del día en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gasolina
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: precios de gasolina $(TZ=America/Mexico_City date +%F)"
            git push
          fi

      # Sube dist/ a Hostinger por SSH (rsync). Configura estos Secrets en
      # Settings → Secrets and variables → Actions: SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY, REMOTE_PATH
      - name: Subir a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::Faltan los Secrets de SSH; se omite la publicación."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete --stats \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            dist/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH"
